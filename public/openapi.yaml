openapi: 3.1.0

info:
  title: API KalkulatorKolejowy.pl
  version: 1.1.0
  summary: Tablice odjazdów z opóźnieniami oraz katalogi stacji kolejowych.
  description: |
    Otwarte API serwisu, bez klucza i bez rejestracji. Dane o pociągach
    pochodzą z **bilkom.pl** i powstają przez analizę strony HTML — nie jest to
    źródło oficjalne, więc zmiana układu tamtej strony może chwilowo zaburzyć
    działanie tablic. Katalog stacji pochodzi z **Portalu Pasażera**.

    ## Zmiany w wersji 1.1.0

    Pola z opóźnieniami są teraz liczbami, a nie ciągami znaków:

    - `delay` — zawsze liczba całkowita. Wcześniej przy opóźnieniu wracał ciąg
      (`"25"`), a przy jego braku raz `0`, raz `"0"`.
    - `via[].delayonarrival` i `via[].delayondeparture` — liczba albo `null`,
      gdy Bilkom nie podaje opóźnienia dla danego przystanku. Wcześniej był to
      ciąg znaków, a brak danych oznaczał pusty ciąg.

    Jeśli porównujesz te pola operatorem ścisłym (`===`), sprawdź swój kod.

  contact:
    name: KalkulatorKolejowy.pl
    url: https://kalkulatorkolejowy.pl/

tags:
  - name: Tablice
    description: Odjazdy i przyjazdy pociągów dla wskazanej stacji.
  - name: Stacje
    description: Katalogi stacji kolejowych. Zmieniają się rzadko, więc warto zapisać je u siebie.

paths:
  /bilkom/api/{type}/{mode}/{stationId}:
    get:
      tags: [Tablice]
      summary: Tablica odjazdów lub przyjazdów
      description: |
        Zwraca listę pociągów dla wskazanej stacji. Godzina zapytania to zawsze
        bieżący moment w czasie polskim — nie da się odpytać o przeszłość ani
        przyszłość.

        Odpowiedzi są cache'owane przez 30 sekund, więc częstsze odpytywanie tej
        samej stacji nie obciąża źródła. Prosimy jednak nie nadużywać trybu
        `extended` razem z `arrivals` lub `departures` — każdy pociąg na tablicy
        oznacza wtedy pobranie osobnej strony szczegółów.
      operationId: getBilkomBoard
      parameters:
        - name: type
          in: path
          required: true
          description: |
            Rodzaj tablicy. Warianty `next*` zwracają jeden pociąg: ten, który
            odjedzie (lub przyjedzie) **najwcześniej faktycznie**, czyli po
            uwzględnieniu opóźnień. Nie musi to być pierwsza pozycja tablicy —
            Bilkom porządkuje ją według rozkładu, więc pociąg opóźniony o pół
            godziny stoi tam nadal na swoim planowym miejscu.
          schema:
            type: string
            enum: [departures, arrivals, nextdeparture, nextarrival]
          examples:
            departures:
              value: departures
              summary: Wszystkie odjazdy
            arrivals:
              value: arrivals
              summary: Wszystkie przyjazdy
            nextdeparture:
              value: nextdeparture
              summary: Najbliższy faktyczny odjazd
            nextarrival:
              value: nextarrival
              summary: Najbliższy faktyczny przyjazd
        - name: mode
          in: path
          required: true
          description: |
            Zakres danych.

            - `extended` — dopisuje pola `amenities` i `via`, pobierając osobną
              stronę szczegółów dla każdego pociągu na tablicy.
            - **każda inna wartość** — zestaw podstawowy. Przyjęło się `basic`,
              starsze wersje dokumentacji podawały `normal`; działają tak samo,
              bo sprawdzane jest wyłącznie dosłowne `extended`.
          schema:
            type: string
          examples:
            basic:
              value: basic
              summary: Zestaw podstawowy
            normal:
              value: normal
              summary: To samo co basic - zapis z wczesniejszej dokumentacji
            extended:
              value: extended
              summary: Z udogodnieniami i stacjami pośrednimi
        - name: stationId
          in: path
          required: true
          description: Numer stacji według bilkom.pl. Musi być liczbą.
          schema:
            type: string
            pattern: '^[0-9]+$'
          example: '5100069'
      x-codeSamples:
        - lang: cURL
          label: curl
          source: |
            curl https://kalkulatorkolejowy.pl/bilkom/api/nextdeparture/basic/5100069
        - lang: PHP
          source: |
            $url = 'https://kalkulatorkolejowy.pl/bilkom/api/departures/basic/5100069';
            $pociagi = json_decode(file_get_contents($url), true);

            foreach ($pociagi as $pociag) {
                printf(
                    "%s  %-10s -> %s%s" . PHP_EOL,
                    date('H:i', (int) $pociag['timestamp']),
                    $pociag['trainCode'],
                    $pociag['arrivalStation'],
                    (int) $pociag['delay'] > 0 ? '  (+' . $pociag['delay'] . ' min)' : ''
                );
            }
        - lang: JavaScript
          source: |
            const odpowiedz = await fetch(
                'https://kalkulatorkolejowy.pl/bilkom/api/nextdeparture/basic/5100069'
            );
            const [pociag] = await odpowiedz.json();

            console.log(pociag.trainCode, '->', pociag.arrivalStation);
            console.log('planowo', new Date(pociag.timestamp * 1000).toLocaleTimeString('pl-PL'));
      responses:
        '200':
          description: Lista pociągów. Pusta tablica oznacza brak pociągów na tablicy.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Train'
              examples:
                zOpoznieniem:
                  summary: Pociąg opóźniony
                  value:
                    - extraLink: /pociag/szczegoly?tc=IC&nr=3806
                      trainCode: IC 3806
                      timestamp: 1755900000
                      track: '2'
                      platform: III
                      arrivalStation: Ustka
                      delay: 2
                      calculatedTime: 1755900120
                      currentStation: Wrocław Główny
                bezOpoznienia:
                  summary: Pociąg jadący zgodnie z rozkładem
                  value:
                    - extraLink: /pociag/szczegoly?tc=IC&nr=3100
                      trainCode: IC 3100
                      timestamp: 1755900000
                      track: ''
                      platform: ''
                      arrivalStation: Warszawa Wschodnia
                      delay: 0
                      calculatedTime: 1755900000
                      currentStation: Wrocław Główny
        '400':
          description: Nieprawidłowy parametr `type` albo `stationId` niebędący liczbą.
          content:
            application/json:
              schema:
                type: string
              examples:
                zlyTyp:
                  value: Invalid type
                zlaStacja:
                  value: Invalid station ID
        '503':
          description: |
            Nie udało się pobrać danych z bilkom.pl albo strona nie zawiera
            tablicy. Zwykle chwilowe — warto ponowić zapytanie.
          content:
            application/json:
              schema:
                type: string
              examples:
                brakPolaczenia:
                  value: Connection error
                bladDanych:
                  value: Bilkom data download error

  /distance/api/stations:
    get:
      tags: [Stacje]
      summary: Nazwy stacji znanych kalkulatorowi odległości
      description: |
        Posortowana lista nazw stacji, między którymi kalkulator potrafi
        wyznaczyć trasę. Tych samych nazw używa podpowiadanie w formularzu na
        stronie `/distance`.
      operationId: getDistanceStations
      x-codeSamples:
        - lang: cURL
          label: curl
          source: |
            curl https://kalkulatorkolejowy.pl/distance/api/stations
      responses:
        '200':
          description: Lista nazw stacji.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: ['Abramowice', 'Adamowo', 'Aleksandrów Kujawski', 'Andrespol']

  /mapa/stacje.json:
    get:
      tags: [Stacje]
      summary: Katalog stacji ze współrzędnymi
      description: |
        Wszystkie stacje i przystanki z katalogu Portalu Pasażera wraz z
        położeniem i adresem. Odpowiedź waży około 700 kB, więc warto zapisać
        ją u siebie zamiast pobierać wielokrotnie - nagłówki pozwalają
        przeglądarce trzymać ją w pamięci podręcznej przez dobę.
      operationId: getMapStations
      x-codeSamples:
        - lang: cURL
          label: curl
          source: |
            curl https://kalkulatorkolejowy.pl/mapa/stacje.json
      responses:
        '200':
          description: Lista stacji z położeniem.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MapStation'
              example:
                - name: Wrocław Główny
                  address: PIŁSUDSKIEGO 105 50-085 WROCŁAW
                  lat: 51.09851
                  lng: 17.03668
                  displayUrl: R0FQU0tJZSNR

components:
  schemas:
    Train:
      type: object
      description: Pojedynczy pociąg na tablicy.
      properties:
        extraLink:
          type: [string, 'null']
          description: Względny adres strony szczegółów pociągu w serwisie bilkom.pl.
        trainCode:
          type: string
          description: Kod przewoźnika i numer pociągu.
          examples: ['IC 3100']
        timestamp:
          type: integer
          description: Planowa godzina odjazdu lub przyjazdu, uniksowy znacznik czasu w sekundach.
        track:
          type: string
          description: Tor. Pusty ciąg, gdy nieznany.
        platform:
          type: string
          description: Peron, zwykle cyframi rzymskimi. Pusty ciąg, gdy nieznany.
        arrivalStation:
          type: string
          description: Stacja docelowa pociągu (dla przyjazdów — początkowa).
        delay:
          type: integer
          description: |
            Opóźnienie w pełnych minutach. Zero oznacza jazdę zgodnie z
            rozkładem, wartość ujemna — pociąg przed czasem.
          examples: [0, 25, -4]
        calculatedTime:
          type: integer
          description: Znacznik czasu z uwzględnieniem opóźnienia.
        currentStation:
          type: string
          description: Nazwa stacji, dla której zwrócono tablicę.
        amenities:
          type: array
          description: Udogodnienia w pociągu. Wyłącznie w trybie `extended`.
          items:
            type: string
        via:
          type: array
          description: |
            Stacje pośrednie na trasie pociągu. Wyłącznie w trybie `extended`.

            Stacja końcowa **nie** znajduje się na tej liście — jest zwracana
            osobno w polu `arrivalStation`. Stacja początkowa pozostaje;
            rozpoznasz ją po pustym polu `arrival`.
          items:
            $ref: '#/components/schemas/ViaStation'
      required:
        - trainCode
        - timestamp
        - delay
        - calculatedTime
        - currentStation

    MapStation:
      type: object
      description: Stacja z katalogu Portalu Pasażera.
      properties:
        name:
          type: string
          examples: ['Wrocław Główny']
        address:
          type: [string, 'null']
          description: Adres tak, jak podaje go Portal Pasażera - zwykle wersalikami.
        lat:
          type: number
          description: Szerokość geograficzna, zaokrąglona do 5 miejsc po przecinku.
          examples: [51.09851]
        lng:
          type: number
          description: Długość geograficzna, zaokrąglona do 5 miejsc po przecinku.
          examples: [17.03668]
        displayUrl:
          type: [string, 'null']
          description: |
            Identyfikator wyświetlacza w Portalu Pasażera. Pełny adres tablicy
            to `https://portalpasazera.pl/Wyswietlacz?sid=` z doklejoną tą wartością.

    ViaStation:
      type: object
      description: |
        Stacja pośrednia na trasie pociągu. Bez stacji końcowej — tę podaje
        pole `arrivalStation` nadrzędnego obiektu.
      properties:
        arrival:
          type: [integer, 'null']
          description: Planowy przyjazd, znacznik czasu. Null na stacji początkowej.
        departure:
          type: [integer, 'null']
          description: Planowy odjazd, znacznik czasu. Null na stacji końcowej.
        delayonarrival:
          type: [integer, 'null']
          description: |
            Opóźnienie przyjazdu w pełnych minutach. `null`, gdy Bilkom nie
            podaje tej informacji dla danego przystanku — co zdarza się częściej
            niż nie, więc nie należy tego mylić z punktualnością.
        delayondeparture:
          type: [integer, 'null']
          description: |
            Opóźnienie odjazdu w pełnych minutach. `null` oznacza brak danych,
            tak samo jak przy `delayonarrival`.
        stop:
          type: integer
          minimum: 1
          description: |
            Planowy postój w minutach, nigdy mniej niż 1. Na stacji początkowej
            i końcowej, gdzie postoju nie da się wyznaczyć, również zwracana
            jest jedynka - to zaszłość zachowana dla zgodności.
        station:
          type: string
          description: Nazwa stacji.
        ondemand:
          type: boolean
          description: Czy stacja ma status "na żądanie" (NŻ).
        thisStation:
          type: boolean
          description: |
            Czy to stacja, dla której zwrócono tablicę. Bywa niepoprawne na
            stacjach zbiorczych, gdzie nazwy nie zgadzają się dokładnie.
        beforeThis:
          type: boolean
          description: |
            Czy stacja leży na trasie przed stacją zapytania. Z tym samym
            zastrzeżeniem co `thisStation`.
